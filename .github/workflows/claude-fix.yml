name: Claude Fix

# Claude Code addresses CI failures and Codex review findings on a PR, then
# pushes a fix commit to the PR branch. Triggered by:
#   - the Agent Loop orchestrator (workflow_dispatch), or
#   - a trusted human commenting "@claude ..." on a PR.
#
# Requires (see docs/EXTERNAL_SETUP.md):
#   - the Claude GitHub App installed on this repo (so its pushes trigger CI), and
#   - secret ANTHROPIC_API_KEY *or* CLAUDE_CODE_OAUTH_TOKEN.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to fix
        required: true
      iteration:
        description: Fix round number (for logs)
        required: true
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-fix-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Humans: only OWNER/MEMBER/COLLABORATOR comments containing @claude.
    if: >-
      vars.AGENT_LOOP_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis_ci_only
          POSTGRES_DB: jarvis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jarvis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jarvis:jarvis_ci_only@localhost:5432/jarvis_test
      TEST_DATABASE_URL: postgresql://jarvis:jarvis_ci_only@localhost:5432/jarvis_test
      JARVIS_AUTH_MODE: dev
      JARVIS_ALLOW_DEV_AUTH: "true"
      JARVIS_DEV_USER_EMAIL: alex.rivera@example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Resolve PR branch
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ inputs.pr_number }}" \
            --jq '"head_ref=\(.head.ref)\nhead_repo=\(.head.repo.full_name)\nbase_ref=\(.base.ref)"' >> "$GITHUB_OUTPUT"

      - name: Refuse unsafe targets
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (steps.pr.outputs.head_repo != github.repository || steps.pr.outputs.head_ref == 'main')
        run: |
          echo "Claude only pushes to same-repo feature branches, never main."; exit 1

      - name: Save trusted prompt template from the default branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/claude
          path: trusted
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        run: cp trusted/.github/claude/fix-prompt.md "${RUNNER_TEMP}/fix-prompt.md" && rm -rf trusted

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref || '' }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy

      - name: Build fix prompt
        id: prompt
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ITERATION: ${{ inputs.iteration }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          # Template comes from the default branch checkout of .github/ (see the restore step below).
          {
            echo "text<<PROMPT_EOF"
            envsubst '${PR_NUMBER} ${GITHUB_REPOSITORY} ${ITERATION} ${HEAD_REF}' < "${RUNNER_TEMP}/fix-prompt.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # For @claude comments the action builds its own prompt from the comment;
          # for orchestrator dispatches we pass the fix task.
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run *),Bash(npm test*),Bash(npx prisma migrate dev*),Bash(npx prisma generate*),Bash(npx prettier*),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh run view*)"
            --disallowedTools "Bash(gh pr merge*),Bash(gh pr review*),Bash(git push*main*),Bash(git push*--force*),Bash(curl*),Bash(wget*)"
